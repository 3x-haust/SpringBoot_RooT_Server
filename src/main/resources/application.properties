spring.application.name=RooT_Server

jwt.secret=${JWT_SECRET:dev-only-root-jwt-secret-change-me-00000000000000000000000000000000}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

server.port=${SERVER_PORT:8080}

socketio.host=${SOCKETIO_HOST:0.0.0.0}
socketio.port=${SOCKETIO_PORT:9092}
socketio.origin=${SOCKETIO_ORIGIN:*}

spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:postgres}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
spring.data.redis.timeout=2000ms

# Elasticsearch
spring.elasticsearch.uris=${SPRING_ELASTICSEARCH_URIS:${ELASTICSEARCH_URL:http://${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}}}
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=30s

image.upload.dir=uploads/images

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
